<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Screening Desk — Resume Matcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2430;
    --ink-soft:#4b5568;
    --paper:#eef0ea;
    --paper-card:#f8f9f5;
    --rule:#c8cdbe;
    --gold:#a9822f;
    --good:#3d6b4f;
    --mid:#a9822f;
    --bad:#a3402f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:880px;margin:0 auto;padding:56px 24px 96px;}
  header{margin-bottom:40px;border-bottom:1px solid var(--rule);padding-bottom:28px;}
  .kicker{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.02em;color:var(--gold);margin:0 0 10px;}
  h1{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:38px;
    margin:0 0 10px;
    letter-spacing:-.01em;
  }
  .sub{color:var(--ink-soft);font-size:16px;max-width:60ch;margin:0;}

  .panel{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:28px;
    margin-bottom:24px;
  }
  label{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  textarea, input[type=file]{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
    background:#fff;
    border:1px solid var(--rule);
    border-radius:3px;
    padding:12px 14px;
  }
  textarea{min-height:150px;resize:vertical;}
  .field{margin-bottom:22px;}
  .field:last-of-type{margin-bottom:0;}

  button{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    letter-spacing:.02em;
    background:var(--ink);
    color:var(--paper-card);
    border:none;
    padding:13px 22px;
    border-radius:3px;
    cursor:pointer;
  }
  button:hover{background:#333f52;}
  button:disabled{background:#9aa0ab;cursor:not-allowed;}

  #status{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);margin-top:14px;min-height:18px;}

  .results{margin-top:8px;}
  .result-card{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-left:4px solid var(--rule);
    border-radius:3px;
    padding:22px 24px;
    margin-bottom:16px;
  }
  .result-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;}
  .filename{font-family:'Source Serif 4',serif;font-size:19px;font-weight:600;}
  .score{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;}
  .score-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);text-align:right;display:block;margin-bottom:2px;}
  .explanation{margin:14px 0 16px;color:var(--ink);font-size:15px;}
  .skill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .skill-row .row-label{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);width:100%;margin-bottom:4px;}
  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    padding:3px 9px;
    border-radius:20px;
    border:1px solid var(--rule);
  }
  .chip.matched{background:#e4ede6;border-color:#bcd2c2;color:var(--good);}
  .chip.missing{background:#f2e5e0;border-color:#e0c2b6;color:var(--bad);}
  .meta-line{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:14px;}

  .empty{color:var(--ink-soft);font-size:14px;font-style:italic;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker">SMART RESUME SCREENING SYSTEM</p>
    <h1>Screening Desk</h1>
    <p class="sub">Paste a job description, drop in resumes, and get a relevance score with matched skills, gaps, and a short rationale for each candidate.</p>
  </header>

  <div class="panel">
    <div class="field">
      <label for="jd">JOB DESCRIPTION</label>
      <textarea id="jd" placeholder="Paste the full job description here...">We are hiring a Python developer with experience in FastAPI, machine learning, and NLP. Familiarity with scikit-learn, pandas, Docker, and REST API design is required. 2+ years of experience preferred.</textarea>
    </div>
    <div class="field">
      <label for="resumes">RESUMES (.pdf, .docx, .txt — multiple allowed)</label>
      <input type="file" id="resumes" multiple accept=".pdf,.docx,.txt" />
    </div>
    <button id="run">Score candidates</button>
    <div id="status"></div>
  </div>

  <div class="results" id="results">
    <p class="empty">Results will appear here after you run a match.</p>
  </div>
</div>

<script>
const API_BASE = window.location.origin;

function scoreColor(score){
  if(score >= 75) return 'var(--good)';
  if(score >= 45) return 'var(--mid)';
  return 'var(--bad)';
}

function renderChips(list, cls){
  if(!list || list.length === 0) return '<span class="empty">none</span>';
  return list.map(s => `<span class="chip ${cls}">${s}</span>`).join('');
}

function renderResults(data){
  const container = document.getElementById('results');
  if(!data.results || data.results.length === 0){
    container.innerHTML = '<p class="empty">No results.</p>';
    return;
  }
  container.innerHTML = data.results.map(r => `
    <div class="result-card" style="border-left-color:${scoreColor(r.match_score)}">
      <div class="result-head">
        <div class="filename">${r.filename}</div>
        <div>
          <span class="score-label">MATCH SCORE</span>
          <span class="score" style="color:${scoreColor(r.match_score)}">${r.match_score}/100</span>
        </div>
      </div>
      <p class="explanation">${r.explanation}</p>
      <div class="skill-row">
        <span class="row-label">MATCHED SKILLS</span>
        ${renderChips(r.matched_skills, 'matched')}
      </div>
      <div class="skill-row">
        <span class="row-label">MISSING SKILLS</span>
        ${renderChips(r.missing_skills, 'missing')}
      </div>
      <div class="meta-line">Detected experience: ~${r.years_experience} yrs</div>
    </div>
  `).join('');
}

document.getElementById('run').addEventListener('click', async () => {
  const jd = document.getElementById('jd').value.trim();
  const files = document.getElementById('resumes').files;
  const statusEl = document.getElementById('status');
  const button = document.getElementById('run');

  if(!jd){ statusEl.textContent = 'Please paste a job description.'; return; }
  if(!files.length){ statusEl.textContent = 'Please choose at least one resume file.'; return; }

  const formData = new FormData();
  formData.append('job_description', jd);
  for(const f of files){ formData.append('resumes', f); }

  button.disabled = true;
  statusEl.textContent = 'Scoring candidates...';

  try{
    const res = await fetch(`${API_BASE}/match`, { method: 'POST', body: formData });
    if(!res.ok){
      const errText = await res.text();
      throw new Error(errText || res.statusText);
    }
    const data = await res.json();
    renderResults(data);
    statusEl.textContent = `Done — scored ${data.results.length} resume(s).`;
  }catch(err){
    statusEl.textContent = `Error: ${err.message}`;
  }finally{
    button.disabled = false;
  }
});
</script>
</body>
</html>
